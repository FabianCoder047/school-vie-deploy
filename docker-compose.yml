# =====================================================================
# School Vie — tout démarre ensemble :
#   docker compose up -d --build
#
# Un seul conteneur : MariaDB + migrations + seed + API + SPA (port 5000).
# Les secrets et réglages se mettent dans un fichier .env à côté de ce
# fichier (voir .env.example). Les données sont dans le volume school-vie-data.
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # "/api" = front et API sur la même origine (recommandé).
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Même origine : pas de CORS à configurer.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      UPLOADS_DIR: /data/uploads

      # --- Base locale (laisser DB_HOST vide ou à 127.0.0.1) ---
      # Pour utiliser la base Aiven existante : DB_HOST=…, DB_PORT=18922,
      # DB_SSL=true, DB_SKIP_CREATE_DATABASE=true dans le .env.
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-school_vie_db_004774}
      DB_USER: ${DB_USER:-schoolvie}
      DB_PASSWORD: ${DB_PASSWORD:-SchoolVie2026!Db}
      DB_SSL: ${DB_SSL:-false}
      DB_SKIP_CREATE_DATABASE: ${DB_SKIP_CREATE_DATABASE:-true}

      # --- Sécurité (à remplacer dans le .env) ---
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-changez-access-secret-avant-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changez-refresh-secret-avant-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # --- Admin initial (mot de passe généré dans les logs si vide) ---
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@school-vie.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOM: ${ADMIN_NOM:-Administrateur}
      ADMIN_PRENOM: ${ADMIN_PRENOM:-École}
      SCHOOL_NAME: ${SCHOOL_NAME:-School Vie}
      FORCE_SEED: ${FORCE_SEED:-false}

      # --- E-mails (Brevo / SMTP, Resend…) ---
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSORD: ${MAIL_PASSORD:-}
      MAIL_FROM: ${MAIL_FROM:-School Vie <no-reply@school-vie.local>}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-School Vie}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-true}
      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-http://localhost:5000/reinitialiser-mot-de-passe}
      RESET_TOKEN_EXPIRES_MINUTES: ${RESET_TOKEN_EXPIRES_MINUTES:-60}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - school-vie-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  school-vie-data:
