# =====================================================================
# School Vie — Blueprint Render : UN seul service Docker tout-en-un.
# L'image contient l'API Express, la SPA Vite (PWA) et MySQL 8.
# Les données sont sur le disque persistant monté sur /data.
#
# Voir DOCKER.md pour la procédure et le dépannage.
# =====================================================================
services:
  - type: web
    name: school-vie-api
    runtime: docker
    region: frankfurt
    branch: main
    # Le disque persistant est nécessaire pour garder MySQL et les uploads.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT est injecté automatiquement par Render (l'API le respecte).
      - key: CLIENT_URL
        value: https://school-vie-api.onrender.com
      - key: UPLOADS_DIR
        value: /data/uploads

      # --- MySQL 8 local dans le conteneur ---
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: school_vie_db_004774
      - key: DB_USER
        value: schoolvie
      - key: DB_PASSWORD
        generateValue: true
      - key: DB_SSL
        value: "false"
      - key: DB_SKIP_CREATE_DATABASE
        value: "true"

      # --- Sécurité ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "30"

      # --- Admin initial : laissé vide -> mot de passe généré et affiché
      #     dans les logs au premier démarrage (voir DOCKER.md).
      - key: ADMIN_EMAIL
        value: admin@school-vie.local
      - key: ADMIN_NOM
        value: Administrateur
      - key: ADMIN_PRENOM
        value: École
      - key: SCHOOL_NAME
        value: School Vie

      # --- E-mails (Brevo SMTP port 2525, non bloqué par Render) ---
      - key: MAIL_PROVIDER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_SECURE
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSORD
        sync: false
      - key: MAIL_DRY_RUN
        value: "false"
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: School Vie
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESET_PASSWORD_URL
        value: https://school-vie-api.onrender.com/reinitialiser-mot-de-passe
      - key: RESET_TOKEN_EXPIRES_MINUTES
        value: "60"
    disk:
      name: school-vie-data
      mountPath: /data
      sizeGB: 1
